resources:
  jobs:
    Spotify_data_load_job:
      name: Spotify_data_load_job
      tasks:
        - task_key: Fact_silver_task
          notebook_task:
            notebook_path: ../../src/silver/silver_notebooks/Silver_Facts
            base_parameters:
              file_name: FactStream
            source: WORKSPACE
        - task_key: parameter_task
          notebook_task:
            notebook_path: /../../src/silver/silver_notebooks/parameters
            source: WORKSPACE
        - task_key: Silver_dim_task
          depends_on:
            - task_key: parameter_task
          for_each_task:
            inputs: "{{tasks.parameter_task.values.datasets}}"
            task:
              task_key: Silver_dim_task_iteration
              notebook_task:
                notebook_path: ../../src/silver/silver_notebooks/Silver_Dimensions
                base_parameters:
                  file_name: ""
                source: WORKSPACE
        - task_key: DLT_GOLD_task
          depends_on:
            - task_key: Fact_silver_task
            - task_key: Silver_dim_task
          pipeline_task:
            pipeline_id: 5c8293bc-526b-4623-8aba-fb81872078b0
            full_refresh: false
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
